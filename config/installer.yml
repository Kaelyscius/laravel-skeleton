# Configuration Laravel Template par défaut
project:
  name: "Laravel"
  domain: "laravel.local"
services:
  optional:
    mailpit:
      enabled: true
      environments: ["local", "development"]
    adminer:
      enabled: true
      environments: ["local", "development"]
    it-tools:
      enabled: true
      environments: ["local", "development"]
    dozzle:
      enabled: true
      environments: ["local", "development", "staging"]
network:
  ports:
    mariadb: 3306
    redis: 6379
    dozzle: 9999
environments:
  local:
    debug: true
    log_level: "debug"
  development:
    debug: true
    log_level: "debug"
  staging:
    debug: false
    log_level: "info"
  production:
    debug: false
    log_level: "error"
security:
  snyk:
    severity_threshold: "high"
    fail_on_issues: false
    monitor_enabled: true
# Configuration des packages Laravel à installer
packages:
  production:
    - name: "laravel/horizon"
      version: "^5.0"
      required: true
    - name: "laravel/telescope"
      version: "^5.0"
      required: true
    - name: "laravel/sanctum"
      version: "^4.0"
      required: true
    - name: "laravel/nightwatch"
      version: "^1.0"
      required: false
    - name: "spatie/laravel-permission"
      version: "^7.0"
      required: true
      description: "v7+ : PHP ^8.4 + Laravel ^12 uniquement. BREAKING: event classes renommées (ex. PermissionAttached → PermissionAttachedEvent)"
    - name: "spatie/laravel-activitylog"
      version: "^5.0"
      required: true
      description: "v5+ : PHP ^8.4 + Laravel ^12 uniquement. BREAKING: nouvelle colonne attribute_changes, LogBatch supprimé, méthodes renommées — migration requise sur projets existants"
    # predis/predis supprimé : phpredis (PECL) est installé dans le Dockerfile, ~10x plus rapide
    - name: "spatie/laravel-csp"
      version: "^3.0"
      required: true
      description: "Content Security Policy headers pour sécurité XSS — middleware enregistré dans bootstrap/app.php"
    - name: "spatie/laravel-health"
      version: "^1.0"
      required: true
      description: "Health checks application (DB, Cache, Queue, etc.) — config/health.php + route /health"
    - name: "spatie/laravel-schedule-monitor"
      version: "^4.0"
      required: false
      description: "Monitoring des tâches cron et scheduled jobs"
    - name: "laravel/pulse"
      version: "^1.0"
      required: true
      description: "Dashboard monitoring temps réel : exceptions, slow queries, jobs, cache, HTTP"
  development:
    # Core packages first (required)
    - name: "nunomaduro/collision"
      version: "^8.0"
      required: true
    - name: "laravel/boost"
      version: "^2.0"
      required: true
      description: "AI-assisted development: MCP server + Laravel guidelines pour Claude Code / Cursor"
    - name: "barryvdh/laravel-ide-helper"
      version: "^3.0"
      required: true
    - name: "fruitcake/laravel-debugbar"
      version: "^4.0"
      required: true
      description: "Anciennement barryvdh/laravel-debugbar — renommé en fruitcake/ depuis v4.0"
    # beyondcode/laravel-query-detector supprimé : incompatible Laravel 12, fonctionnalité couverte par laravel-debugbar
    - name: "pestphp/pest"
      version: "^4.0"
      required: true
    - name: "pestphp/pest-plugin-laravel"
      version: "^4.0"
      required: true
    - name: "pestphp/pest-plugin-drift"
      version: "^4.0"
      required: false
      php_version: ">=8.3"
      description: "Détecte le code non couvert par les tests et mutation testing"
    # Quality tools (optional - PHP 8.5 compatible versions)
    - name: "symplify/easy-coding-standard"
      version: "^13.0"
      required: false
      php_version: ">=8.3"
      description: "PHP 8.5 compatible"
    - name: "rector/rector"
      version: "^2.3"
      required: false
      php_version: ">=8.2"
      description: "Latest version with PHPStan 2.x support"
    - name: "larastan/larastan"
      version: "^3.0"
      required: false
      php_version: ">=8.2"
    - name: "driftingly/rector-laravel"
      version: "^2.0"
      required: false
      php_version: ">=8.0"
      description: "Règles Rector pour Laravel - v2.0 compatible Laravel 12"
    - name: "nunomaduro/phpinsights"
      version: "^2.14"
      required: false
      php_version: ">=8.3"
    - name: "php-code-archeology/php-code-archeology"
      version: "^2.0"
      required: false
      php_version: ">=8.2"
      description: "Architecture metrics, git churn analysis, health score (complète PHPStan)"
    # ivqonsanada/enlightn supprimé : fork communautaire peu maintenu, pas l'Enlightn officiel
    # Alternative : enlightn/enlightn (payant) ou se fier à PHPStan + ECS déjà en place
