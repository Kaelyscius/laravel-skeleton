name: Docker Build & Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docker/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose*.yml'
      # Sans cette ligne, modifier CE workflow ne le déclenche pas : un
      # correctif du pipeline ne pouvait donc jamais être vérifié par le
      # pipeline. Constaté le 2026-07-27 — le commit 4ea60a2 n'a produit
      # aucun run.
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docker/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose*.yml'
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to registry'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: docker.io
  NAMESPACE: laravel-skeleton

  # ⛔ LE SEGMENT PROPRIÉTAIRE NE DOIT JAMAIS POUVOIR ÊTRE VIDE.
  # 🔴 MESURÉ le 2026-08-24 sur la PR Dependabot #27 : le tag construit valait
  # `docker.io//laravel-skeleton-apache:pr-27` — DEUX barres obliques — et buildx
  # sortait sur « invalid reference format », AVANT même de lire le Dockerfile.
  # Cause : `secrets.DOCKER_USERNAME` est VIDE dans une PR Dependabot, qui
  # dispose d'un périmètre de secrets distinct. Conséquence : TOUTE PR Dependabot
  # rougissait son build Docker, pour une raison étrangère à la dépendance
  # montée — un rouge qui nomme le mauvais coupable, et qu'on apprend à ignorer.
  # ⚖️ Le repli ne sert QU'À rendre la référence syntaxiquement valide : l'étape
  # `push:` reste conditionnée à la présence réelle des identifiants, donc rien
  # n'est jamais poussé sous ce nom. Il est en minuscules parce que Docker refuse
  # les majuscules dans un nom de dépôt — `github.repository_owner` ne convenait
  # donc pas tel quel.
  FALLBACK_OWNER: build-only

jobs:
  # ==========================================
  # JOB 1: DOCKER VALIDATION
  # ==========================================
  validation:
    name: Docker Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ==========================================
      # Docker setup and validation
      # ==========================================
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: 🔍 Validate docker-compose files
        run: |
          echo "🔍 Validating docker-compose configuration..."

          # Check main docker-compose.yml
          if docker compose config >/dev/null 2>&1; then
            echo "✅ docker-compose.yml is valid"
          else
            echo "❌ docker-compose.yml validation failed"
            docker compose config
            exit 1
          fi

          # Check override files
          for override in docker-compose.*.yml; do
            if [ -f "$override" ]; then
              echo "Checking $override..."
              if docker compose -f docker-compose.yml -f "$override" config >/dev/null 2>&1; then
                echo "✅ $override is valid"
              else
                echo "❌ $override validation failed"
                docker compose -f docker-compose.yml -f "$override" config
              fi
            fi
          done

      - name: 🔍 Lint Dockerfiles
        run: |
          echo "🔍 Linting Dockerfiles..."
          
          # Install hadolint
          wget -O hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x hadolint
          
          # Lint all Dockerfiles
          find . -name "Dockerfile*" -type f | while read -r dockerfile; do
            echo "Linting $dockerfile..."
            if ./hadolint "$dockerfile"; then
              echo "✅ $dockerfile passed hadolint"
            else
              echo "⚠️ $dockerfile has linting issues"
            fi
          done

      - name: 🔍 Check Docker security
        run: |
          echo "🔍 Checking Docker security best practices..."
          
          # Check for common security issues
          echo "Checking for root user usage..."
          if grep -r "USER root" docker/; then
            echo "⚠️ Found USER root in Dockerfiles - consider using non-root user"
          else
            echo "✅ No explicit root user usage found"
          fi
          
          echo "Checking for latest tags..."
          if grep -r ":latest" docker/ docker-compose*.yml; then
            echo "⚠️ Found :latest tags - consider using specific versions"
          else
            echo "✅ No :latest tags found"
          fi
          
          echo "Checking for hardcoded secrets..."
          if grep -r -E "(password|secret|key|token)" docker/ --include="*.dockerfile" --include="Dockerfile*"; then
            echo "⚠️ Potential hardcoded secrets found in Docker files"
          else
            echo "✅ No obvious hardcoded secrets in Docker files"
          fi

  # ==========================================
  # JOB 2: BUILD IMAGES
  # ==========================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validation
    strategy:
      matrix:
        service: [php, apache, node]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # ==========================================
      # Prepare build environment
      # ==========================================
      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Le compte propriétaire est OBLIGATOIRE. Sans lui, `docker.io/laravel-skeleton-apache`
          # n'a qu'un seul segment de chemin : Docker le résout en
          # `docker.io/library/laravel-skeleton-apache`, l'espace de noms officiel,
          # où personne ne peut pousser. D'où l'échec constant du workflow :
          #   push access denied … insufficient_scope: authorization failed
          # 🔴 ET IL A UN REPLI, PARCE QU'IL PEUT ÊTRE ABSENT (voir `FALLBACK_OWNER`).
          # Le secret est vide dans une PR Dependabot : sans ce repli, la référence
          # dégénère en `docker.io//…` et buildx refuse le format.
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_USERNAME || env.FALLBACK_OWNER }}/${{ env.NAMESPACE }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # ==========================================
      # Check Docker registry credentials
      # ==========================================
      - name: 🔑 Check registry credentials
        id: registry_check
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "registry_available=true" >> $GITHUB_OUTPUT
            echo "✅ Docker registry credentials available"
          else
            echo "registry_available=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Docker registry credentials not configured"
          fi

      # ==========================================
      # Login to registry (if credentials available)
      # ==========================================
      - name: 🔐 Log in to Docker Hub
        if: steps.registry_check.outputs.registry_available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ==========================================
      # Build and optionally push images
      # ==========================================
      - name: 🔨 Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.registry_check.outputs.registry_available == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || inputs.push_images) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # Sans `load`, l'image poussée n'existe PAS dans le démon local du
          # runner : l'étape de test suivante tentait un `docker run` sur une
          # image absente, d'où « pull access denied ».
          load: true
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}

      # ==========================================
      # Test built image
      # ==========================================
      - name: 🧪 Test ${{ matrix.service }} image
        run: |
          echo "🧪 Testing ${{ matrix.service }} image..."
          
          # Basic smoke test
          # Le nom doit venir de metadata-action, pas être reconstruit à la main :
          # la reconstruction omettait le compte propriétaire ET utilisait un tag
          # `:${{ github.sha }}` qui ne fait pas partie des tags produits
          # (main, latest, main-<sha-court>).
          image_name="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          echo "Image testée : $image_name"
          
          # `--entrypoint` est INDISPENSABLE, pas cosmétique. Ces images ont un
          # entrypoint qui démarre le service : sans surcharge, la commande
          # passée est reçue comme argument par l'entrypoint, qui l'ignore et
          # lance le serveur. Le test affichait alors « Démarrage du container »
          # au lieu d'exécuter la vérification — un test qui ne testait rien.
          case "${{ matrix.service }}" in
            "php")
              echo "Testing PHP image..."
              docker run --rm --entrypoint php "$image_name" --version
              docker run --rm --entrypoint composer "$image_name" --version
              echo "✅ PHP image test passed"
              ;;
            "apache")
              echo "Testing Apache image..."
              docker run --rm --entrypoint httpd "$image_name" -v
              echo "✅ Apache image test passed"
              ;;
            "node")
              echo "Testing Node.js image..."
              docker run --rm --entrypoint node "$image_name" --version
              docker run --rm --entrypoint npm "$image_name" --version
              echo "✅ Node.js image test passed"
              ;;
          esac

  # ==========================================
  # JOB 3: INTEGRATION TEST
  # ==========================================
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validation, build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ==========================================
      # Test complete stack
      # ==========================================
      - name: 🧪 Test complete Docker stack
        run: |
          echo "🧪 Testing complete Docker environment..."
          
          # DEUX fichiers .env sont nécessaires, et ils doivent CONCORDER.
          #
          # docker-compose.yml lit ${DB_DATABASE}, ${DB_USERNAME}, ${DB_PASSWORD}
          # depuis le .env de la RACINE (substitution de variables Compose) pour
          # initialiser POSTGRES_DB/USER/PASSWORD. src/.env, lui, ne sert qu'à
          # Laravel.
          #
          # Le job ne copiait que src/.env : les variables Compose restaient
          # vides, Postgres ne pouvait pas s'initialiser et sortait unhealthy en
          # une demi-seconde — « dependency failed to start ».
          #
          # Et il ne suffit pas de copier les deux : si la racine crée la base
          # `laravel` et que Laravel se connecte en `laravel_test`, la migration
          # échoue juste après. Les mêmes valeurs sont donc écrites des deux côtés.
          cp .env.example .env
          cp src/.env.example src/.env

          # Racine — consommé par Compose pour initialiser PostgreSQL
          cat >> .env << 'EOF'
          DB_DATABASE=laravel_test
          DB_USERNAME=laravel_test
          DB_PASSWORD=laravel_test
          EOF

          # src/ — consommé par Laravel, valeurs identiques
          cat >> src/.env << 'EOF'
          APP_ENV=testing
          DB_CONNECTION=pgsql
          DB_HOST=postgres
          DB_DATABASE=laravel_test
          DB_USERNAME=laravel_test
          DB_PASSWORD=laravel_test
          REDIS_HOST=redis
          CACHE_STORE=redis
          SESSION_DRIVER=redis
          TELESCOPE_ENABLED=false
          PULSE_ENABLED=false
          NIGHTWATCH_ENABLED=false
          EOF
          
          # Les dépendances DOIVENT être installées avant de démarrer la stack.
          #
          # src/vendor/ est gitignoré, donc absent du checkout du runner.
          # L'entrypoint du conteneur php a `set -e` et lance `php artisan
          # config:clear` : sans vendor/autoload.php, artisan échoue, l'entrypoint
          # sort, et le conteneur meurt une demi-seconde après son démarrage —
          # « dependency failed to start: container laravel-app_php is unhealthy ».
          #
          # Reproduit localement :
          #   require(/var/www/html/vendor/autoload.php): Failed to open stream
          echo "Building images..."
          docker compose build

          echo "Installing PHP dependencies..."
          docker compose run --rm --no-deps --entrypoint composer php \
            install --no-interaction --prefer-dist --no-progress --no-scripts

          echo "Generating application key..."
          docker compose run --rm --no-deps --entrypoint php php \
            artisan key:generate --no-interaction --force

          docker compose run --rm --no-deps --entrypoint composer php \
            dump-autoload --optimize

          # Start services
          echo "Starting Docker services..."
          docker compose up -d

          # Wait for services to be ready
          echo "Waiting for services to start..."
          sleep 30

          # Check service health
          echo "Checking service health..."
          docker compose ps

          # Test database connectivity
          echo "Testing database connectivity..."
          docker compose exec -T php php artisan migrate --force --no-interaction || echo "Migration failed (expected for fresh setup)"

          # Test web server
          echo "Testing web server..."
          if curl -f http://localhost || true; then
            echo "✅ Web server responding"
          else
            echo "⚠️ Web server not responding (may be expected)"
          fi

          # Cleanup
          echo "Cleaning up..."
          docker compose down -v
          
          echo "✅ Integration test completed"

      # ==========================================
      # Security scan of built images
      # ==========================================
      - name: 🛡️ Security scan images
        run: |
          echo "🛡️ Running security scan on built images..."
          
          # Install Trivy
          sudo apt-get update
          sudo apt-get install wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy
          
          # Scan images for vulnerabilities
          for service in php apache node; do
            # ⛔ LE SEGMENT PROPRIÉTAIRE MANQUAIT ICI, et c'est le défaut que le
            # commentaire de l'étape « Extract metadata » décrit comme fatal —
            # reproduit dans un second job, où personne ne le voyait :
            # `docker.io/laravel-skeleton-php` n'a QU'UN segment, donc Docker le
            # résout en `docker.io/library/…`, l'espace de noms officiel.
            image="${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_USERNAME || env.FALLBACK_OWNER }}/${{ env.NAMESPACE }}-${service}:${{ github.sha }}"
            echo "Scanning $image..."
            trivy image --severity HIGH,CRITICAL --format table "$image" || echo "Vulnerabilities found in $service"
          done

      # ==========================================
      # Build summary
      # ==========================================
      - name: 📊 Build Summary
        if: always()
        run: |
          # Ce résumé affichait « ✅ » EN DUR pour chaque ligne, y compris
          # « ✅ Integration test » — affiché tel quel alors que le job venait
          # d'échouer. Un rapport qui annonce le succès quoi qu'il arrive est
          # pire qu'aucun rapport : il entraîne à ne plus le lire.
          # Les résultats viennent désormais des vrais statuts de jobs.
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; cancelled) echo "🚫";; *) echo "❔";; esac; }

          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Étape | Résultat |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation (hadolint · compose · sécurité) | $(icon '${{ needs.validation.result }}') ${{ needs.validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build images + smoke tests (php · apache · node) | $(icon '${{ needs.build.result }}') ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test d'intégration (stack complète) | $(icon '${{ job.status }}') ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "### Registry" >> $GITHUB_STEP_SUMMARY
            if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
              echo "- ✅ Images pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
              echo "- 🔗 Registry: https://hub.docker.com/u/${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ℹ️ Images built locally (no registry configured)" >> $GITHUB_STEP_SUMMARY
              echo "- 💡 Add DOCKER_USERNAME and DOCKER_PASSWORD secrets to enable registry push" >> $GITHUB_STEP_SUMMARY
            fi
          fi