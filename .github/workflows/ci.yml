name: Laravel CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
  workflow_dispatch:

env:
  PHP_VERSION: 8.5
  NODE_VERSION: 24

jobs:
  # ==========================================
  # JOB 1: TESTS & QUALITÉ
  # ==========================================
  tests:
    name: Tests & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # PostgreSQL 17 — moteur de production (ADR-0007, architecture §9.2).
      # Doit rester aligné sur l'image du service `postgres` de docker-compose.yml.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: laravel_test
          POSTGRES_USER: laravel_test
          POSTGRES_PASSWORD: laravel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U laravel_test -d laravel_test"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=5
          --health-start-period=30s

      redis:
        image: redis:8.6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # Setup PHP avec extensions Laravel 12
      # ==========================================
      - name: 🐘 Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, hash, intl, json, libxml, mbstring, openssl, pcre, pdo, pdo_pgsql, redis, session, tokenizer, xml, zip
          coverage: xdebug
          tools: composer:v2
          ini-values: memory_limit=2G, max_execution_time=300, opcache.jit=0

      # ==========================================
      # Setup Node.js (mise à jour vers v22)
      # ==========================================
      - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ==========================================
      # Cache Composer optimisé
      # ==========================================
      - name: 📋 Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: 💾 Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-
            ${{ runner.os }}-php-${{ env.PHP_VERSION }}-

      # ==========================================
      # Installation Composer optimisée
      # ==========================================
      - name: 🎵 Install Composer dependencies
        working-directory: src
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress
          composer dump-autoload --optimize

      # ==========================================
      # Cache NPM optimisé
      # ==========================================
      - name: 💾 Cache NPM dependencies
        uses: actions/cache@v5
        with:
          path: src/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-npm-${{ hashFiles('src/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-npm-
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      # ==========================================
      # Installation NPM
      # ==========================================
      - name: 📦 Install NPM dependencies
        working-directory: src
        run: npm ci --prefer-offline --no-audit

      # ==========================================
      # Configuration Laravel
      # ==========================================
      - name: ⚙️ Configure Laravel environment
        working-directory: src
        run: |
          # Copier .env.example vers .env
          cp .env.example .env

          # Configuration optimisée pour les tests
          # NOTE: utilisation de printf pour éviter l'indentation YAML dans le heredoc
          printf '%s\n' \
            'APP_ENV=testing' \
            'APP_DEBUG=true' \
            '' \
            '# Base de données de test — PostgreSQL 17 (ADR-0007).' \
            '# Doit rester cohérent avec src/phpunit.xml, dont les <env> priment' \
            '# sur ce .env (Dotenv immutable ne surcharge pas une var déjà définie).' \
            'DB_CONNECTION=pgsql' \
            'DB_HOST=127.0.0.1' \
            'DB_PORT=5432' \
            'DB_DATABASE=laravel_test' \
            'DB_USERNAME=laravel_test' \
            'DB_PASSWORD=laravel_test' \
            '' \
            '# Redis pour cache et sessions' \
            'REDIS_HOST=127.0.0.1' \
            'REDIS_PORT=6379' \
            'CACHE_DRIVER=redis' \
            'SESSION_DRIVER=redis' \
            'QUEUE_CONNECTION=redis' \
            '' \
            '# Disable external services in tests' \
            'MAIL_MAILER=array' \
            'BROADCAST_DRIVER=log' \
            '' \
            '# Telescope (ne pas persister en test)' \
            'TELESCOPE_ENABLED=false' \
            >> .env

          # Générer la clé d'application
          php artisan key:generate --no-interaction

      # ==========================================
      # Build des assets
      # ==========================================
      - name: 🏗️ Build assets
        working-directory: src
        run: npm run build

      # ==========================================
      # Base de données
      # ==========================================
      - name: 🗄️ Wait for database and run migrations
        working-directory: src
        env:
          PGPASSWORD: laravel_test
        run: |
          # Attendre que PostgreSQL accepte les connexions
          timeout 60 bash -c 'until pg_isready -h 127.0.0.1 -p 5432 -U laravel_test -d laravel_test >/dev/null 2>&1; do sleep 2; done'
          echo "✅ Database connection successful"
          
          # Exécuter les migrations
          php artisan migrate --force --no-interaction
          echo "✅ Migrations completed"

      # ==========================================
      # Garde-fou tenancy v1 (Story 1.5) — gate de déploiement.
      # NB: le volet PostgreSQL de la Story 2.8 est fait. Restent à traiter dans
      # Epic 2 : matrice PHP 8.4 + 8.5.1, découpage en jobs séparés, et bascule
      # de Rector/Insights en informatifs (architecture §9.2).
      # ==========================================
      - name: 🔒 Assert tenancy invariant (mono-streamer)
        working-directory: src
        run: |
          php artisan db:seed --class=StreamerSeeder --force --no-interaction
          php artisan tenancy:assert

      # ==========================================
      # Outils de qualité (utiliser les scripts Composer)
      # ==========================================
      - name: 🎨 Run Code Style Check (ECS)
        working-directory: src
        run: composer run check:cs

      - name: 🔍 Run Static Analysis (PHPStan)
        working-directory: src
        run: composer run analyse

      - name: 🔧 Run Rector (dry-run)
        working-directory: src
        run: composer run refactor

      - name: 💡 Run PHP Insights
        working-directory: src
        run: composer run insights

      # ==========================================
      # Tests avec coverage (Clover XML pour Codecov)
      # NOTE: test:coverage génère un rapport HTML (usage local).
      # En CI on génère le format Clover XML requis par Codecov.
      # ==========================================
      - name: 🧪 Run tests with coverage
        working-directory: src
        run: vendor/bin/pest --coverage-clover coverage.xml

      # ==========================================
      # Upload coverage report
      # ==========================================
      - name: 📊 Upload coverage to Codecov
        if: success() && hashFiles('src/coverage.xml') != ''
        uses: codecov/codecov-action@v4
        with:
          file: src/coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # ==========================================
      # Résumé des tests
      # ==========================================
      - name: 📋 Test Summary
        if: always()
        run: |
          echo "## 🎯 Laravel CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP**: ${{ env.PHP_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js**: ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Laravel**: $(cd src && php artisan --version | cut -d' ' -f3)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quality Tools" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ECS (Code Style)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ PHPStan (Static Analysis)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Rector (Refactoring)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ PHP Insights (Quality)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Pest (Tests)" >> $GITHUB_STEP_SUMMARY

