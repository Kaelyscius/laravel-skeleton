name: Laravel CI/CD Pipeline

# Découpé en jobs séparés conformément à docs/architecture/9-architecture-qualit.md §9.2.
# L'implémentation précédente était un job monolithique où TOUTES les étapes
# bloquaient, y compris Rector et PHP Insights que la spec désigne comme
# informatifs. Cet écart spec <-> implémentation a vécu toute l'Epic 1 sans
# produire le moindre signal (risque R-009 du test design système).
#
# Actions épinglées par SHA : un tag est un pointeur mutable contrôlé par un
# tiers, exécuté avec le GITHUB_TOKEN du dépôt. Sur un projet destiné à être
# forké (ADR-0001), la supply chain CI est une surface d'attaque de premier plan.
# Le commentaire de version à droite du SHA sert à la lisibilité et aux bots de
# mise à jour.

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'scripts/quality-ratchet.sh'
      # Les scripts du runner navigateur décident du verdict du job `browser`.
      # Sans cette entrée, une modification du garde-fou ne déclencherait pas la
      # CI qui s'en sert — un garde-fou qu'on peut changer sans le réexécuter.
      - 'docker/php/scripts/run-browser-tests.sh'
      - 'docker/php/scripts/browser-verdict.php'
      # Le vhost porte des invariants que `src/**` teste sans pouvoir les
      # atteindre : `ExpiresByType font/woff2 "access plus 1 year"` (Story 1.9)
      # est assuré par un test de `src/tests/`, mais la ligne vit ICI. Sans cette
      # entrée, la supprimer ne déclenchait aucune CI — un garde-fou dont la
      # cible est hors du périmètre qui le fait tourner. Relevé à la seconde
      # passe de revue de la 1.9 (2026-08-09).
      - 'docker/apache/**'
      # Les primitives shell partagées et les modules d'installation sont
      # éprouvés par src/tests/Unit/ShellRuntimeLibTest.php. Sans ces deux
      # entrées, casser `retry` ou le pilote `00-prerequisites.sh` ne
      # déclenchait AUCUNE CI : le garde-fou existe, mais rien ne le rejoue.
      - 'scripts/lib/**'
      - 'scripts/install/**'
      # L'orchestrateur lui-même n'était PAS dans cette liste : `scripts/install/**`
      # ne couvre pas `scripts/install.sh`. On pouvait donc casser l'idempotence
      # de l'installeur (Story 2.2) sans qu'aucun run ne démarre. Même motif pour
      # le lockfile, qui vit à la racine de `scripts/`.
      - 'scripts/install.sh'
      - 'scripts/install-lockfile.sh'
      # Le Makefile est SUJET DE TEST depuis la story 2.2 : un test vérifie que
      # `install-lockfile` est appelé après `npm-install` et jamais en prod.
      # Sans cette entrée, on peut casser la chaîne d'installation sans qu'aucun
      # run ne démarre — exactement le défaut que cette story corrige pour
      # `scripts/install.sh`, reconduit un cran plus loin.
      - 'Makefile'
      # Les primitives de verdict du E2E d'installation (story 2.4) vivent en
      # shell et sont éprouvées par `tests/bats/unit`. Sans cette entrée, on
      # pouvait casser la lecture du lockfile ou l'étiquetage d'une panne
      # d'infrastructure sans qu'aucun run ne démarre — le nightly, lui, ne
      # tourne qu'une fois par nuit et ne le dirait que le lendemain.
      - 'tests/bats/**'
      # 🔴 TROIS CIBLES DE GARDE-FOUS VIVAIENT HORS DE CETTE LISTE (clôture 2.4).
      #   • `docker/php/scripts/docker-entrypoint.sh` — `docker/apache/**` est
      #     couvert depuis la 1.9, mais PAS son homologue php, alors que c'est
      #     lui qui portait le défaut d'installation de clone neuf et qu'il est
      #     désormais éprouvé par `src/tests/Unit/PhpEntrypointStateTest.php` ;
      #   • `docker-compose*.yml` — le healthcheck, `restart: unless-stopped` et
      #     les ports publiés que `tests/bats/unit` DÉRIVE de ces fichiers ;
      #   • `.github/workflows/nightly.yml` — gardé par
      #     `src/tests/Unit/WorkflowInputSafetyTest.php`, qui balaye tout le
      #     répertoire des workflows : on pouvait donc casser le job d'alerte
      #     sans qu'aucun run ne démarre. C'est le défaut exact déjà consigné
      #     pour `scripts/install.sh`, reconduit deux crans plus loin.
      - 'docker/php/scripts/docker-entrypoint.sh'
      # Les Dockerfiles décident de l'UID réellement appliqué dans les images,
      # et `tests/bats/uid.bats` l'éprouve. Sans ces entrées, on pouvait rendre
      # un `ARG UID` inerte — le défaut qui a bloqué le nightly au run
      # 32748093741 — sans qu'aucun run ne démarre.
      - 'docker/node/**'
      - 'docker/php/Dockerfile'
      - 'docker-compose*.yml'
      - '.github/workflows/nightly.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'scripts/quality-ratchet.sh'
      # Les scripts du runner navigateur décident du verdict du job `browser`.
      # Sans cette entrée, une modification du garde-fou ne déclencherait pas la
      # CI qui s'en sert — un garde-fou qu'on peut changer sans le réexécuter.
      - 'docker/php/scripts/run-browser-tests.sh'
      - 'docker/php/scripts/browser-verdict.php'
      # Le vhost porte des invariants que `src/**` teste sans pouvoir les
      # atteindre : `ExpiresByType font/woff2 "access plus 1 year"` (Story 1.9)
      # est assuré par un test de `src/tests/`, mais la ligne vit ICI. Sans cette
      # entrée, la supprimer ne déclenchait aucune CI — un garde-fou dont la
      # cible est hors du périmètre qui le fait tourner. Relevé à la seconde
      # passe de revue de la 1.9 (2026-08-09).
      - 'docker/apache/**'
      # Les primitives shell partagées et les modules d'installation sont
      # éprouvés par src/tests/Unit/ShellRuntimeLibTest.php. Sans ces deux
      # entrées, casser `retry` ou le pilote `00-prerequisites.sh` ne
      # déclenchait AUCUNE CI : le garde-fou existe, mais rien ne le rejoue.
      - 'scripts/lib/**'
      - 'scripts/install/**'
      # L'orchestrateur lui-même n'était PAS dans cette liste : `scripts/install/**`
      # ne couvre pas `scripts/install.sh`. On pouvait donc casser l'idempotence
      # de l'installeur (Story 2.2) sans qu'aucun run ne démarre. Même motif pour
      # le lockfile, qui vit à la racine de `scripts/`.
      - 'scripts/install.sh'
      - 'scripts/install-lockfile.sh'
      # Le Makefile est SUJET DE TEST depuis la story 2.2 : un test vérifie que
      # `install-lockfile` est appelé après `npm-install` et jamais en prod.
      # Sans cette entrée, on peut casser la chaîne d'installation sans qu'aucun
      # run ne démarre — exactement le défaut que cette story corrige pour
      # `scripts/install.sh`, reconduit un cran plus loin.
      - 'Makefile'
      # Les primitives de verdict du E2E d'installation (story 2.4) vivent en
      # shell et sont éprouvées par `tests/bats/unit`. Sans cette entrée, on
      # pouvait casser la lecture du lockfile ou l'étiquetage d'une panne
      # d'infrastructure sans qu'aucun run ne démarre — le nightly, lui, ne
      # tourne qu'une fois par nuit et ne le dirait que le lendemain.
      - 'tests/bats/**'
      # 🔴 TROIS CIBLES DE GARDE-FOUS VIVAIENT HORS DE CETTE LISTE (clôture 2.4).
      #   • `docker/php/scripts/docker-entrypoint.sh` — `docker/apache/**` est
      #     couvert depuis la 1.9, mais PAS son homologue php, alors que c'est
      #     lui qui portait le défaut d'installation de clone neuf et qu'il est
      #     désormais éprouvé par `src/tests/Unit/PhpEntrypointStateTest.php` ;
      #   • `docker-compose*.yml` — le healthcheck, `restart: unless-stopped` et
      #     les ports publiés que `tests/bats/unit` DÉRIVE de ces fichiers ;
      #   • `.github/workflows/nightly.yml` — gardé par
      #     `src/tests/Unit/WorkflowInputSafetyTest.php`, qui balaye tout le
      #     répertoire des workflows : on pouvait donc casser le job d'alerte
      #     sans qu'aucun run ne démarre. C'est le défaut exact déjà consigné
      #     pour `scripts/install.sh`, reconduit deux crans plus loin.
      - 'docker/php/scripts/docker-entrypoint.sh'
      # Les Dockerfiles décident de l'UID réellement appliqué dans les images,
      # et `tests/bats/uid.bats` l'éprouve. Sans ces entrées, on pouvait rendre
      # un `ARG UID` inerte — le défaut qui a bloqué le nightly au run
      # 32748093741 — sans qu'aucun run ne démarre.
      - 'docker/node/**'
      - 'docker/php/Dockerfile'
      - 'docker-compose*.yml'
      - '.github/workflows/nightly.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Moindre privilège par défaut. Un job qui a besoin de plus le déclare lui-même.
permissions:
  contents: read

env:
  PHP_VERSION: 8.5
  NODE_VERSION: 24

jobs:
  # ===========================================================================
  # JOB 0 — INTÉGRITÉ DU DÉPÔT (secrets + fichiers manquants)
  # ===========================================================================
  # Bloquant prod n°1 de docs/architecture/7-architecture-scurit.md §7.1.
  integrity:
    name: Integrity (gitleaks · fichiers suivis)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scanne l'HISTORIQUE : un clone superficiel ne verrait que
          # le dernier commit et raterait tout secret introduit puis retiré.
          fetch-depth: 0

      # Binaire officiel plutôt que gitleaks/gitleaks-action : une action tierce
      # de moins à qui faire confiance dans le pipeline (même raisonnement que
      # l'épinglage par SHA), et cela évite la licence que l'action exige pour
      # les comptes d'organisation.
      - name: 🔐 Scan de secrets (gitleaks, historique complet)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks git --redact --no-banner --verbose .

      # Attrape les fichiers présents en local mais exclus du dépôt par un
      # pattern .gitignore trop large — 4 occurrences réelles constatées.
      - name: 📦 Aucun fichier source/doc exclu du dépôt
        run: ./scripts/assert-tracked-files.sh

  # ===========================================================================
  # JOB 1 — QUALITÉ (sans base de données)
  # ===========================================================================
  # Vérifié : ECS, PHPStan et Insights tournent tous sans connexion DB.
  quality:
    name: Quality (ECS · PHPStan · Ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐘 Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, hash, intl, json, libxml, mbstring, openssl, pcre, pdo, pdo_pgsql, redis, session, tokenizer, xml, zip
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=2G, max_execution_time=300, opcache.jit=0

      - name: 📋 Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: 💾 Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-

      - name: 🎵 Install Composer dependencies
        working-directory: src
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: ⚙️ Minimal Laravel environment
        working-directory: src
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      # --- Bloquants -------------------------------------------------------
      - name: 🎨 Code Style (ECS)
        working-directory: src
        run: composer run check:cs

      # PHPStan est INFORMATIF, et ce n'est pas un relâchement : la baseline porte
      # 9 erreurs héritées du scaffolding vendor publié en Story 1.1. Le rendre
      # bloquant garantissait un job rouge en permanence — un gate qui échoue
      # toujours n'est pas un gate, c'est du bruit qu'on apprend à ignorer.
      #
      # La barrière, c'est le ratchet juste en dessous : il interdit la 10e
      # erreur. Les 9 restent VISIBLES en annotations sur la PR, ce qu'une
      # baseline PHPStan aurait justement escamoté.
      - name: 🔍 Static Analysis (PHPStan L8, informatif)
        working-directory: src
        continue-on-error: true
        run: composer run analyse

      # LE gate de dette : bloquant, et c'est lui qui compte.
      - name: 🔒 Quality ratchet (la dette ne remonte jamais)
        run: ./scripts/quality-ratchet.sh

      # ⛔ LE CLONE DE BATS EST MIS EN CACHE (revue 1). Sans cela, une porte
      # BLOQUANTE dépendait d'un `git clone` vers github.com à chaque exécution :
      # le mode de défaillance même que `e2e_infra_fail` existe pour éviter,
      # réintroduit dans le gate. La clé porte la version épinglée, donc une
      # montée invalide le cache d'elle-même. Le `run_bats` du Makefile réessaie
      # trois fois et nomme l'échec INFRASTRUCTURE si le cache est froid ET le
      # réseau indisponible.
      - name: 💾 Cache bats-core (épinglé)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/bats-core
          key: ${{ runner.os }}-bats-v1.14.0-eb7f42f8d608ac693d7a4b67474f6714ea68cfc5

      # Les primitives de verdict du nightly E2E (story 2.4). Elles décident
      # si une fenêtre d'installation est valide et si un échec est imputable
      # à l'infrastructure : les laisser dormir jusqu'au prochain run nocturne
      # reviendrait à ne les éprouver qu'une fois par nuit, sur une PR qu'on
      # aurait déjà mergée. Bloquant, sans base de données, ~1 seconde.
      - name: 🦇 Tests shell Bats (primitives du E2E)
        run: make test-bats

      # ⛔ L'UID DEMANDÉ EST-IL RÉELLEMENT APPLIQUÉ DANS LES IMAGES ?
      # Un `ARG UID` inerte a bloqué le nightly au run 32748093741 : `npm`
      # tournait sous un uid sans entrée `passwd`, donc sans `HOME`, et sortait
      # en 243. Ce garde EXÉCUTE le bloc d'ajustement dans l'image de base — il
      # exige donc Docker, que le runner fournit, et coûte une dizaine de
      # secondes. Le laisser au seul nightly reviendrait à ne l'éprouver
      # qu'une fois par nuit, après merge.
      - name: 🆔 UID des images réellement appliqué (Bats · Docker)
        run: make test-bats-uid

      # --- Informatifs (architecture §9.2) ---------------------------------
      # Rector est cassé par une incompatibilité de configuration connue :
      # rector.php lie phpstan.neon, qui inclut l'extension Larastan, laquelle
      # exige une application Laravel bootée. `continue-on-error` est ici un
      # choix de spec, pas un contournement — la spec le désigne informatif.
      - name: 🔧 Rector (dry-run, informatif)
        working-directory: src
        continue-on-error: true
        run: composer run refactor

      - name: 💡 PHP Insights (informatif)
        working-directory: src
        continue-on-error: true
        run: composer run insights

  # ===========================================================================
  # JOB 2 — TESTS (PostgreSQL 18)
  # ===========================================================================
  tests:
    name: Tests (Pest × PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # PostgreSQL 18 — moteur de production (ADR-0007, architecture §9.2).
      # Doit rester aligné sur l'image du service `postgres` de docker-compose.yml.
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15 # 18.4 / alpine 3.24.1
        env:
          POSTGRES_DB: laravel_test
          POSTGRES_USER: laravel_test
          POSTGRES_PASSWORD: laravel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U laravel_test -d laravel_test"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=5
          --health-start-period=30s

      redis:
        image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241 # 8.10.0 / alpine 3.23.5
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐘 Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, hash, intl, json, libxml, mbstring, openssl, pcre, pdo, pdo_pgsql, redis, session, tokenizer, xml, zip
          coverage: xdebug
          tools: composer:v2
          ini-values: memory_limit=2G, max_execution_time=300, opcache.jit=0

      - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📋 Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: 💾 Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-

      - name: 🎵 Install Composer dependencies
        working-directory: src
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress
          composer dump-autoload --optimize

      - name: 💾 Cache NPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-npm-${{ hashFiles('src/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-npm-

      - name: 📦 Install NPM dependencies
        working-directory: src
        run: npm ci --prefer-offline --no-audit

      - name: ⚙️ Configure Laravel environment
        working-directory: src
        run: |
          cp .env.example .env

          # NOTE : phpunit.xml impose déjà DB_CONNECTION=pgsql et
          # DB_DATABASE=laravel_test, et ses <env> PRIMENT sur ce .env
          # (Dotenv immutable ne surcharge pas une variable déjà définie).
          # Les deux doivent donc rester cohérents — une divergence produirait
          # des migrations sur une base et des tests sur une autre.
          printf '%s\n' \
            'APP_ENV=testing' \
            'APP_DEBUG=true' \
            '' \
            '# Base de données de test — PostgreSQL 18 (ADR-0007 amendé)' \
            'DB_CONNECTION=pgsql' \
            'DB_HOST=127.0.0.1' \
            'DB_PORT=5432' \
            'DB_DATABASE=laravel_test' \
            'DB_USERNAME=laravel_test' \
            'DB_PASSWORD=laravel_test' \
            '' \
            '# Redis pour cache et sessions' \
            'REDIS_HOST=127.0.0.1' \
            'REDIS_PORT=6379' \
            'CACHE_STORE=redis' \
            'SESSION_DRIVER=redis' \
            'QUEUE_CONNECTION=redis' \
            '' \
            '# Désactiver les services externes en test' \
            'MAIL_MAILER=array' \
            'BROADCAST_DRIVER=log' \
            'TELESCOPE_ENABLED=false' \
            'PULSE_ENABLED=false' \
            'NIGHTWATCH_ENABLED=false' \
            >> .env

          php artisan key:generate --no-interaction

      - name: 🏗️ Build assets
        working-directory: src
        run: npm run build

      - name: 🗄️ Wait for database and run migrations
        working-directory: src
        run: |
          timeout 60 bash -c 'until pg_isready -h 127.0.0.1 -p 5432 -U laravel_test -d laravel_test >/dev/null 2>&1; do sleep 2; done'
          echo "✅ Database connection successful"
          php artisan migrate --force --no-interaction
          echo "✅ Migrations completed"

      # Garde-fou tenancy v1 (Story 1.5) — gate de déploiement.
      - name: 🔒 Assert tenancy invariant (mono-streamer)
        working-directory: src
        run: |
          php artisan db:seed --class=StreamerSeeder --force --no-interaction
          php artisan tenancy:assert

      - name: 🧪 Run tests with coverage
        working-directory: src
        run: vendor/bin/pest --coverage-clover coverage.xml

      - name: 📊 Upload coverage to Codecov
        if: success() && hashFiles('src/coverage.xml') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          # `files` (pluriel) depuis la v5 : l'entrée `file` a été SUPPRIMÉE.
          # Une entrée inconnue est ignorée sans erreur — le rapport aurait été
          # cherché par auto-découverte, ou pas envoyé du tout, sans le dire.
          files: src/coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ===========================================================================
  # JOB 3 — TESTS NAVIGATEUR (ADR-0013)
  # ===========================================================================
  # Pourquoi un job séparé de `tests` : la suite navigateur exige un Chromium et
  # un build Vite à jour, elle n'est PAS déclarée dans phpunit.xml (sinon
  # `php artisan test` l'exécuterait partout), et son verdict ne se lit pas dans
  # le code de sortie de pest. Elle ne partage donc rien avec le job `tests`.
  #
  # ⚠️ DIVERGENCE ASSUMÉE ENTRE LOCAL ET CI, à connaître avant de débugger :
  #   - en local, le runner est le conteneur Alpine `test-browser` et pilote le
  #     Chromium natif d'Alpine (musl) — les builds de Playwright y sont
  #     inexécutables, cf. ADR-0013 ;
  #   - ici, le runner GitHub est Ubuntu (glibc), donc Playwright installe son
  #     propre Chrome for Testing, sans le moindre contournement.
  # Deux navigateurs différents valident donc la même cascade CSS. C'est
  # acceptable — c'est même une couverture plus large — mais un échec présent
  # d'un seul côté est probablement une différence de moteur, pas une régression.
  #
  # La version de Playwright n'est PAS écrite ici : elle vient de
  # src/package-lock.json, pour qu'il n'existe qu'une seule source de vérité.
  browser:
    name: Tests navigateur (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15 # 18.4 / alpine 3.24.1
        env:
          POSTGRES_DB: laravel_test
          POSTGRES_USER: laravel_test
          POSTGRES_PASSWORD: laravel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U laravel_test -d laravel_test"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=5
          --health-start-period=30s

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐘 Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          # `sockets` est exigée par pest-plugin-browser (websocket Playwright).
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, hash, intl, json, libxml, mbstring, openssl, pcre, pdo, pdo_pgsql, redis, session, sockets, tokenizer, xml, zip
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=2G, max_execution_time=300, opcache.jit=0

      - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📋 Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: 💾 Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-

      - name: 🎵 Install Composer dependencies
        working-directory: src
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: 💾 Cache NPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-npm-${{ hashFiles('src/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-npm-

      - name: 📦 Install NPM dependencies
        working-directory: src
        run: npm ci --prefer-offline --no-audit

      # Le cache est indexé sur package-lock.json : une montée de Playwright
      # invalide la clé et retélécharge le navigateur correspondant. Sans ça, un
      # Chromium périmé cohabiterait avec un client plus récent.
      - name: 💾 Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('src/package-lock.json') }}

      - name: 🌐 Install Chromium
        working-directory: src
        run: npx playwright install --with-deps chromium

      - name: ⚙️ Configure Laravel environment
        working-directory: src
        run: |
          cp .env.example .env

          # Mêmes valeurs que le job `tests` : phpunit.xml prime de toute façon,
          # mais une divergence ferait migrer une base et tester l'autre.
          printf '%s\n' \
            'APP_ENV=testing' \
            'APP_DEBUG=true' \
            'DB_CONNECTION=pgsql' \
            'DB_HOST=127.0.0.1' \
            'DB_PORT=5432' \
            'DB_DATABASE=laravel_test' \
            'DB_USERNAME=laravel_test' \
            'DB_PASSWORD=laravel_test' \
            'CACHE_STORE=array' \
            'SESSION_DRIVER=array' \
            'QUEUE_CONNECTION=sync' \
            'MAIL_MAILER=array' \
            'BROADCAST_DRIVER=log' \
            'TELESCOPE_ENABLED=false' \
            'PULSE_ENABLED=false' \
            'NIGHTWATCH_ENABLED=false' \
            >> .env

          php artisan key:generate --no-interaction

      # Indispensable : le test lit une valeur CALCULÉE par le navigateur à
      # partir du CSS compilé. Sans build, il mesurerait un manifeste absent.
      - name: 🏗️ Build assets
        working-directory: src
        run: npm run build

      - name: 🗄️ Wait for database and run migrations
        working-directory: src
        run: |
          timeout 60 bash -c 'until pg_isready -h 127.0.0.1 -p 5432 -U laravel_test -d laravel_test >/dev/null 2>&1; do sleep 2; done'
          php artisan migrate --force --no-interaction

      # Le verdict vient du rapport JUnit, pas du code de sortie de pest :
      # le plugin ne rend pas la main ~1 run sur 2. Toute la logique — et son
      # refus de conclure au vert sans preuve — est dans ces deux scripts.
      - name: 🧪 Run browser tests
        working-directory: src
        run: ../docker/php/scripts/run-browser-tests.sh 300

      - name: 📤 Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-junit-report
          path: /tmp/browser-junit.xml
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # JOB 4 — LE NIGHTLY TOURNE-T-IL ENCORE ? (Story 2.4, revue 1)
  # ===========================================================================
  # 🔴 UN GARDE-FOU QUI CESSE DE TOURNER EST UN GARDE-FOU SILENCIEUX — c'est
  # littéralement le défaut que toute cette story existe pour retirer, et le
  # nightly y était exposé de DEUX façons :
  #
  #   1. GitHub DÉSACTIVE les workflows `schedule` après 60 jours sans activité
  #      dans le dépôt. Le nightly s'arrête alors sans un mot : aucun run rouge,
  #      aucune notification, juste plus rien.
  #   2. Un nightly cassé et jamais relancé se lit exactement comme un nightly
  #      vert : absence de rouge.
  #
  # Ce job transforme ces deux silences en ROUGE, sur une porte que quelqu'un
  # regarde à chaque push.
  #
  # ⚠️ IL EST ROUGE TANT QUE LE NIGHTLY N'A JAMAIS TOURNÉ — c'est l'état réel au
  # moment où cette story est écrite (le workflow n'existe pas encore sur la
  # branche par défaut, donc `workflow_dispatch` n'est pas proposé).
  #
  # ⛔ ET C'EST EXACTEMENT POURQUOI IL EST HORS DES `needs` DE `CI Summary`
  # (décision d'Alex, revue 2). Un rouge ATTENDU en permanence dans le verdict
  # global MASQUE une régression réelle d'`integrity`, `quality`, `tests` ou
  # `browser` : on apprend à lire « CI rouge » comme « ah oui, le nightly ».
  # C'est le mécanisme même du garde-fou qu'on désarme, appliqué au garde-fou
  # anti-désarmement. Il est donc rapporté à part et annoté.
  # 🔁 **BASCULE À FAIRE JUSTE APRÈS LE PREMIER RUN OBSERVÉ** : le remettre dans
  # `needs:` et dans la condition d'échec du résumé. La marche à suivre est
  # écrite dans `docs/ETAT.md`, section « La bascule à faire juste après le
  # premier nightly ».
  nightly-freshness:
    name: Nightly freshness (le garde-fou tourne-t-il ?)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      actions: read

    steps:
      - name: 🌙 Le nightly a-t-il tourné récemment ?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_AGE_DAYS: 3
        run: |
          set -euo pipefail

          # ⛔ Une panne d'API n'est PAS un nightly périmé : on le dit, et on
          # échoue quand même — mais avec la bonne cause.
          if ! state="$(gh api "repos/$REPO/actions/workflows/nightly.yml" --jq '.state' 2>/dev/null)"; then
            echo "::error title=Nightly freshness::Workflow « nightly.yml » introuvable via l'API — il n'existe pas encore sur la branche par défaut, ou l'API a échoué."
            echo "Le nightly ne peut donc pas avoir tourné. Poussez ce workflow, puis lancez-le une fois (Run workflow)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$state" != "active" ]; then
            echo "::error title=Nightly freshness::Le workflow nightly est « $state » — GitHub désactive les schedules après 60 jours sans activité. Réactivez-le dans l'onglet Actions."
            exit 1
          fi

          # ⛔ `// empty` ET NON `// null` : sans lui, `--jq` imprime le LITTÉRAL
          # « null » sur un ensemble vide, et tout test `[ -z … ]` devient faux.
          last="$(gh api "repos/$REPO/actions/workflows/nightly.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // empty')"
          verdict="$(gh api "repos/$REPO/actions/workflows/nightly.yml/runs?per_page=1" --jq '.workflow_runs[0].conclusion // empty')"

          if [ -z "$last" ]; then
            echo "::error title=Nightly freshness::Le nightly n'a JAMAIS tourné. Actions → Nightly E2E Install → Run workflow."
            exit 1
          fi

          age_days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))

          {
            echo "## 🌙 Fraîcheur du nightly"
            echo ""
            echo "Dernier run : \`$last\` (il y a ${age_days} jour(s), conclusion \`${verdict:-en cours}\`) · plafond : ${MAX_AGE_DAYS} jours."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$age_days" -gt "$MAX_AGE_DAYS" ]; then
            echo "::error title=Nightly freshness::Dernier run du nightly il y a ${age_days} jours (plafond ${MAX_AGE_DAYS}). Le garde-fou ne tourne plus."
            exit 1
          fi

          # 🔴 LA CONCLUSION COMPTE AUTANT QUE LA DATE (revue 2). Sans elle, un
          # nightly qui ÉCHOUE toutes les nuits laissait ce garde VERT : le
          # garde-fou écrit pour empêcher qu'un garde-fou s'éteigne en silence
          # était aveugle à son échec. « Il tourne » n'est pas « il passe ».
          case "$verdict" in
            success) ;;
            ""|in_progress|queued|waiting|requested|pending)
              echo "::warning title=Nightly freshness::Dernier run encore en cours (conclusion « ${verdict:-vide} ») — verdict non concluant, fraîcheur OK."
              ;;
            *)
              echo "::error title=Nightly freshness::Le dernier nightly a conclu « $verdict ». Le garde-fou tourne mais il ÉCHOUE."
              exit 1
              ;;
          esac

          echo "✅ Nightly frais (${age_days} j) et vert."

  # ===========================================================================
  # RÉSUMÉ
  # ===========================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [integrity, quality, tests, browser]
    if: always()

    steps:
      - name: 📋 Summary
        run: |
          echo "## 🎯 Laravel CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Résultat |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Integrity (gitleaks · fichiers suivis) | ${{ needs.integrity.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality (ECS · PHPStan · Ratchet) | ${{ needs.quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (Pest × PostgreSQL 18) | ${{ needs.tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests navigateur (Chromium) | ${{ needs.browser.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **\`Nightly freshness\` est rapporté à part et n'est PAS bloquant** tant que le" >> $GITHUB_STEP_SUMMARY
          echo "premier nightly n'a pas tourné : le laisser dans ce résumé masquerait une régression" >> $GITHUB_STEP_SUMMARY
          echo "réelle derrière un rouge attendu. Bascule en bloquant : voir \`docs/ETAT.md\`," >> $GITHUB_STEP_SUMMARY
          echo "section « La bascule à faire juste après le premier nightly »." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Rector et PHP Insights sont **informatifs** (architecture §9.2) :" >> $GITHUB_STEP_SUMMARY
          echo "leur échec n'arrête pas le pipeline mais reste visible dans le job Quality." >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail if a blocking job failed
        if: needs.integrity.result != 'success' || needs.quality.result != 'success' || needs.tests.result != 'success' || needs.browser.result != 'success'
        run: exit 1
