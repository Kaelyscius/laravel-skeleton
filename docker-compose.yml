services:
  apache:
      build:
        context: .
        dockerfile: docker/apache/Dockerfile
        args:
          UID: 1000
          GID: 1000
      container_name: ${COMPOSE_PROJECT_NAME}_apache
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./src:/var/www/html:delegated
        - ./docker/apache/conf/sites-enabled:/etc/apache2/sites-enabled:ro
        - ./docker/apache/conf/ssl:/etc/apache2/ssl:ro
      networks:
        - app-network
      depends_on:
        php:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "curl", "-k", "-f", "https://localhost/up"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 60s
      restart: unless-stopped
      labels:
        - "com.centurylinklabs.watchtower.enable=false"  # Image custom - pas de mise à jour auto

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
      args:
        UID: 1000
        GID: 1000
    container_name: ${COMPOSE_PROJECT_NAME}_php
    volumes:
      - ./src:/var/www/html:delegated
      - .:/var/www/project:ro
      - ./docker/php/conf/php.ini:/usr/local/etc/php/php.ini
      - ./docker/scripts:/docker/scripts:ro
      - ./docker/php/conf/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      - ./docker/supervisor/conf.d:/etc/supervisor/conf.d
    networks:
      - app-network
    working_dir: /var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "/usr/local/bin/healthcheck.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    labels:
      - "com.centurylinklabs.watchtower.enable=false"  # Image custom - pas de mise à jour auto

  # Runner navigateur (ADR-0013). Profil `test` : jamais démarré par
  # `make up-prod` ni `make up-local`. Cible `make test-browser`.
  #
  # ⚠️ Le nom du conteneur ne doit PAS commencer par « <projet>_php » :
  # le Makefile résout le conteneur PHP avec
  #     docker ps -qf "name=$(COMPOSE_PROJECT_NAME)_php"
  # qui filtre par SOUS-CHAÎNE. Un « laravel-app_php_test » matcherait aussi,
  # `docker exec` recevrait deux identifiants, et toutes les cibles make
  # casseraient dès que ce service tourne. D'où « _test_browser ».
  test-browser:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: test          # stage descendant de `development` — prod intacte
      args:
        UID: 1000
        GID: 1000
    container_name: ${COMPOSE_PROJECT_NAME}_test_browser
    # `sleep infinity` : ce conteneur n'expose aucun service, on l'exec.
    # Ni php-fpm ni supervisor ne sont utiles ici.
    entrypoint: ["sleep", "infinity"]
    # ─────────────────────────────────────────────────────────────────────────
    # Les trois réglages ci-dessous ne sont PAS du confort : sans eux, Chromium
    # se bloque par intermittence dans Docker (constaté 3 fois pendant le spike
    # du 2026-08-06, sur des runs verts comme rouges).
    #
    #   ipc: host   → /dev/shm par défaut = 64 Mo, insuffisant pour Chromium.
    #                 Correctif recommandé par la documentation Playwright.
    #   init: true  → dans le conteneur `php`, PID 1 est le master php-fpm, qui
    #                 ne moissonne pas les enfants : les Chromium terminés
    #                 restent zombies et le serveur Playwright ne rend pas la
    #                 main. Docker init (tini) fait la moisson.
    #   shm_size    → filet si `ipc: host` est indisponible (Docker Desktop,
    #                 certains runners CI durcis).
    # ─────────────────────────────────────────────────────────────────────────
    ipc: host
    init: true
    shm_size: 1gb
    volumes:
      - ./src:/var/www/html:delegated
      - .:/var/www/project:ro
      - ./docker/php/conf/php.ini:/usr/local/etc/php/php.ini
      - ./docker/scripts:/docker/scripts:ro
    networks:
      - app-network
    working_dir: /var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    labels:
      - "com.centurylinklabs.watchtower.enable=false"  # Image custom - pas de mise à jour auto

  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15  # 18.4 / alpine 3.24.1
    container_name: ${COMPOSE_PROJECT_NAME}_postgres
    volumes:
      # PostgreSQL 18+ : le point de montage recommandé par l'image officielle
      # est /var/lib/postgresql (et non plus .../data). L'image y crée un
      # sous-répertoire versionné, ce qui permet un `pg_upgrade --link` sans se
      # heurter à une frontière de point de montage.
      # Monter sur .../data fait démarrer le conteneur en erreur :
      # « there appears to be PostgreSQL data in /var/lib/postgresql/data
      #   (unused mount/volume) ».
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/conf.d:/etc/postgresql/conf.d:ro
    networks:
      - app-network
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"   # Image standard - mise à jour auto

  # 📊 POSTGRES-PULSE - DB isolée pour Laravel Pulse (ADR-0004)
  # Always-on (aucun profile) comme postgres. Jamais exposée à l'hôte.
  # Wiring Laravel (config/database.php pgsql_pulse) = Story 3.2.
  postgres-pulse:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15  # 18.4 / alpine 3.24.1
    container_name: ${COMPOSE_PROJECT_NAME}_postgres_pulse
    volumes:
      # Même contrainte PostgreSQL 18+ que le service `postgres` ci-dessus.
      - postgres_pulse_data:/var/lib/postgresql
    networks:
      - app-network
    environment:
      - POSTGRES_DB=${DB_PULSE_DATABASE}
      - POSTGRES_USER=${DB_PULSE_USERNAME}
      - POSTGRES_PASSWORD=${DB_PULSE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"   # Image standard - mise à jour auto

  redis:
    image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241  # 8.10.0 / alpine 3.23.5
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"   # Image standard - mise à jour auto

  node:
      profiles: ["dev"]
      build:
        context: .
        dockerfile: docker/node/Dockerfile
        args:
          UID: 1000
          GID: 1000
      container_name: ${COMPOSE_PROJECT_NAME}_node
      volumes:
        - ./src:/var/www/html:delegated
        - .:/var/www/project:ro
      networks:
        - app-network
      working_dir: /var/www/html
      command: tail -f /dev/null
      restart: unless-stopped
      labels:
        - "com.centurylinklabs.watchtower.enable=false"  # Image custom - pas de mise à jour auto

  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME}_mailpit
    ports:
      - "8025:8025"   # Web UI (identique à MailHog)
      - "1025:1025"   # SMTP (identique à MailHog)
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 60s
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"   # Image standard - mise à jour auto

  adminer:
    profiles: ["dev"]
    image: adminer:latest
    container_name: ${COMPOSE_PROJECT_NAME}_adminer
    ports:
      - "8080:8080"
    networks:
      - app-network
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DEFAULT_DRIVER=pgsql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "file_get_contents('http://localhost:8080');"]
      interval: 60s
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"   # Image standard - mise à jour auto

  it-tools:
    profiles: ["tools"]
    image: corentinth/it-tools:latest
    container_name: ${COMPOSE_PROJECT_NAME}_it-tools
    ports:
      - "8081:80"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 60s
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"   # Image standard - mise à jour auto

  dozzle:
    profiles: ["tools"]
    image: amir20/dozzle:latest
    container_name: ${COMPOSE_PROJECT_NAME}_dozzle
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_TAILSIZE=300
      - DOZZLE_FILTER=name=${COMPOSE_PROJECT_NAME}*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 60s
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"   # Image standard - mise à jour auto

  # 🔄 WATCHTOWER - Mises à jour automatiques
  watchtower:
    profiles: ["tools"]
    image: containrrr/watchtower:latest
    container_name: ${COMPOSE_PROJECT_NAME}_watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring-network
    environment:
      # Configuration de base
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_LABEL_ENABLE=true           # Mode sélectif basé sur les labels
      - WATCHTOWER_LOG_LEVEL=info

      # Planification - Tous les jours à 3h du matin
      - WATCHTOWER_SCHEDULE=0 0 3 * * *

      # Surveillance des repositories privés (si nécessaire)
      # - WATCHTOWER_REPO_USER=${DOCKER_USERNAME}
      # - WATCHTOWER_REPO_PASS=${DOCKER_PASSWORD}

      # Notifications (configurable via .env)
      - WATCHTOWER_NOTIFICATIONS=${WATCHTOWER_NOTIFICATIONS:-}
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL:-}

      # Configuration avancée
      - WATCHTOWER_TIMEOUT=10s
      - WATCHTOWER_ROLLING_RESTART=true
      - WATCHTOWER_INCLUDE_RESTARTING=true

      # Compatibilité API Docker (nécessaire si le daemon exige API >= 1.40)
      - DOCKER_API_VERSION=1.40

      # Debug (peut être activé en développement)
      - WATCHTOWER_DEBUG=${WATCHTOWER_DEBUG:-false}

    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"   # Watchtower peut se mettre à jour lui-même

networks:
  app-network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME}_app_network
  monitoring-network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME}_monitoring_network

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME}_postgres_data
  postgres_pulse_data:
    name: ${COMPOSE_PROJECT_NAME}_postgres_pulse_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME}_redis_data
